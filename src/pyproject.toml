[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "GPA-Calculator-CS3250-aden"
version = "0.1.0"
authors = [
  { name="AdenPotato" },
]
description = "Credit-weighted GPA calculation from letter grades and credit hours"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/AdenPotato/CS3250-project-1"
"Bug Tracker" = "https://github.com/AdenPotato/CS3250-project-1/issues"

# ship only the library - src/ also holds the Flask app and init_db.py
[tool.hatch.build.targets.wheel]
packages = ["gpa_calculator"]

[tool.hatch.build.targets.sdist]
include = ["gpa_calculator"]
