# Builds the Docker image on every PR into dev or main, so a Dockerfile that breaks on a clean
# checkout fails the PR instead of the grader's build. Every push to dev publishes a pre-release
# named dev-<run number> with its image on GHCR. Pushes to main, and releases published by hand,
# push an image too.
name: Docker image

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # write, so the dev build can create its tag and pre-release
      contents: write
      packages: write
    env:
      PUSH: ${{ github.event_name == 'release' || github.event_name == 'push' }}
      # set only on a push to dev - that is the build that gets its own pre-release
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && format('dev-{0}', github.run_number) || '' }}
    steps:
      - uses: actions/checkout@v4

      # registry names must be lowercase and the repo owner is not
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # a release adds its tag name; latest moves only on main and on full releases, not pre-releases
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=${{ env.RELEASE_TAG }},enable=${{ env.RELEASE_TAG != '' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (github.event_name == 'release' && !github.event.release.prerelease) }}
            type=raw,value=${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say where the image went
        if: env.PUSH == 'true'
        run: |
          {
            echo "### Image pushed"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # runs last, so a pre-release never points at an image that failed to build or push
      - name: Publish the dev pre-release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Automatic pre-release of \`dev\` at ${GITHUB_SHA::7}. Run it with:

          \`\`\`
          docker run --rm -p 5000:5000 $IMAGE:$RELEASE_TAG
          \`\`\`

          Then open http://localhost:5000.
          EOF
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease \
            --title "Dev build $RELEASE_TAG" --notes-file notes.md --generate-notes
